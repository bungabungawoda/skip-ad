name: Rename release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Rename published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1.0 --repo "$GITHUB_REPOSITORY" --title "Skip Ad 0.1.0"
